<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 SUPER GAME ВІД НАЗАРА</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(-45deg,#020024,#090979,#000,#3a0ca3);
background-size:400% 400%;
animation:bg 8s ease infinite;
color:white;
text-align:center;
min-height:100vh;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
font-size:55px;
margin-top:20px;
text-shadow:0 0 20px lime;
}

.panel{
background:rgba(255,255,255,0.08);
padding:20px;
width:90%;
max-width:500px;
margin:auto;
border-radius:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(0,255,0,0.4);
}

input,button,select{
padding:14px;
font-size:20px;
margin:8px;
border:none;
border-radius:15px;
}

button{
background:lime;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 20px lime;
}

#result{
font-size:30px;
margin-top:20px;
min-height:80px;
}

#bar{
width:100%;
height:24px;
background:#222;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

#fill{
height:100%;
width:0%;
background:linear-gradient(
90deg,
red,
orange,
yellow,
lime,
cyan,
blue,
purple
);

background-size:400% 400%;
animation:rgb 3s linear infinite;
transition:0.3s;
}

@keyframes rgb{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

#timer,
#score,
#hearts,
#leaderboard{
font-size:24px;
margin-top:10px;
}

.win{
animation:win 1s infinite;
}

@keyframes win{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.shake{
animation:shake 0.4s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}
}

#shop{
margin-top:30px;
padding:20px;
background:rgba(255,255,255,0.08);
border-radius:20px;
box-shadow:0 0 20px rgba(0,255,255,0.4);
}

#shop h2{
font-size:32px;
color:cyan;
text-shadow:0 0 15px cyan;
}

@media(max-width:600px){

h1{
font-size:36px;
}

input,button,select{
width:90%;
font-size:18px;
}

}

</style>
</head>

<body>

<h1>🎮 SUPER GAME НАЗАРА</h1>

<div class="panel">

<div id="timer">⏳ 0 сек</div>

<div id="score">⭐ Очки: 0</div>

<div id="hearts">❤️❤️❤️</div>

<select id="level">
<option value="50">😊 Легко</option>
<option value="100">😎 Середньо</option>
<option value="500">🔥 Складно</option>
<option value="1000">💀 Божевільно</option>
<option value="10000">☠️ НЕМОЖЛИВО</option>
</select>

<br>

<input
type="number"
id="guess"
placeholder="Введи число"
min="1"
>

<br>

<button onclick="checkGame()">
🎯 Перевірити
</button>

<button onclick="newGame()">
🔄 Нова гра
</button>

<div id="result"></div>

<div id="bar">
<div id="fill"></div>
</div>

<div id="leaderboard"></div>

<div id="shop">

<h2>🛒 МАГАЗИН</h2>

<button onclick="buyLife()">
❤️ Купити життя (50)
</button>

<button onclick="buyHint()">
💡 Підказка (30)
</button>

</div>

</div>

<script>

let secret = 0;
let max = 100;
let attempts = 0;
let lives = 3;
let score = 0;
let gameOver = false;

let startTime;
let timerInterval;

function updateHearts(){

document.getElementById("hearts").innerHTML =
"❤️".repeat(lives);

}

function updateScore(){

document.getElementById("score").innerHTML =
`⭐ Очки: ${score}`;

}

function newGame(){

max =
Number(document.getElementById("level").value);

secret =
Math.floor(Math.random()*max)+1;

attempts = 0;
lives = 8;
gameOver = false;

updateHearts();

startTime = Date.now();

document.getElementById("result").innerHTML="";
document.getElementById("fill").style.width="0%";

clearInterval(timerInterval);

timerInterval = setInterval(()=>{

let sec =
Math.floor((Date.now()-startTime)/1000);

document.getElementById("timer").innerHTML =
`⏳ ${sec} сек`;

},1000);

}

function updateBar(value){

document.getElementById("fill").style.width =
value + "%";

}

function shake(){

document.body.classList.add("shake");

setTimeout(()=>{

document.body.classList.remove("shake");

},400);

}

function saveRecord(time){

let best =
localStorage.getItem("bestTime");

if(!best || time < best){

localStorage.setItem("bestTime",time);

document.getElementById("leaderboard").innerHTML =
`🏆 Новий рекорд: ${time} сек`;

}else{

document.getElementById("leaderboard").innerHTML =
`🏆 Рекорд: ${best} сек`;

}

}

function buyLife(){

if(score >= 50){

score -= 50;

lives++;

updateScore();
updateHearts();

document.getElementById("result").innerHTML =
"❤️ Куплено життя!";

}else{

document.getElementById("result").innerHTML =
"❌ Мало очок";

}

}

function buyHint(){

if(score >= 30){

score -= 30;

updateScore();

if(secret % 2 === 0){

document.getElementById("result").innerHTML =
"💡 Число парне";

}else{

document.getElementById("result").innerHTML =
"💡 Число непарне";

}

}else{

document.getElementById("result").innerHTML =
"❌ Мало очок";

}

}

function checkGame(){

if(gameOver) return;

let user =
Number(document.getElementById("guess").value);

let result =
document.getElementById("result");

if(!user || user < 1){

result.innerHTML =
"⚠️ Введи число";

return;

}

attempts++;

let diff =
Math.abs(secret-user);

let progress =
Math.max(0,100-(diff/max*100));

updateBar(progress);

if(user === secret){

let time =
Math.floor((Date.now()-startTime)/1000);

score += 100;

updateScore();

result.innerHTML =

`🔥 ПЕРЕМОГА
<br>🎯 ${secret}
<br>🧠 ${attempts} спроб
<br>⏳ ${time} сек`;

result.classList.add("win");

saveRecord(time);

clearInterval(timerInterval);

gameOver = true;

return;

}

shake();

lives--;

updateHearts();

if(lives <= 0){

result.innerHTML =

`💀 GAME OVER
<br>Число було: ${secret}`;

clearInterval(timerInterval);

gameOver = true;

return;

}

if(diff <= 5){

result.innerHTML =
"🔥 Дуже гаряче!";

}else if(diff <= 15){

result.innerHTML =
"🌡️ Близько!";

}else{

result.innerHTML =
"❄️ Далеко!";

}

if(user > secret){

result.innerHTML +=
" ⬇️ Менше";

}else{

result.innerHTML +=
" ⬆️ Більше";

}

}

document
.getElementById("guess")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){

checkGame();

}

});

newGame();

</script>

</body>
</html>
```
